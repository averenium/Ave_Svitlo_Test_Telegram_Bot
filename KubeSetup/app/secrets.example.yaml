apiVersion: v1
kind: Secret
metadata:
  name: ave-bot-secrets
  namespace: ave-svitlo
  labels:
    app: ave-svitlo-test-bot
type: Opaque
stringData:
  # Telegram Bot API Token from @BotFather
  telegram-bot-token: "YOUR_TELEGRAM_BOT_TOKEN_HERE"
  
  # PostgreSQL connection parameters
  postgres-host: "postgres"
  postgres-port: "5432"
  postgres-database: "electricity_bot"
  postgres-username: "postgres"
  postgres-password: "YOUR_POSTGRES_PASSWORD_HERE"
